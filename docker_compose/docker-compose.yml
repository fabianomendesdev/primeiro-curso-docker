services:
  postgres:
    container_name: postgres
    image: postgres:19rc1
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # Puxa do .env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/19/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mydb"]
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 20s
  pgAdmin:
    container_name: pgAdmin
    image: dpage/pgadmin4:9.18.0
    environment:
      PGADMIN_DEFAULT_EMAIL: fabianomendesoficial@gmail.com
      PGADMIN_DEFAULT_PASSWORD: 28212002
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:80"
volumes:
  pg_data:
  pgadmin_data: